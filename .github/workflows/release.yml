name: Release

on:
  push:
    tags: ["v*"]
  # Dry run: builds, signs and verifies the installer, publishes nothing.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  VPK_VERSION: 1.2.161 # keep in step with the velopack crate

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        name: Check tag matches Cargo.toml
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match Cargo.toml version $VERSION"; exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  windows:
    needs: version
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      # An empty secret reads the same as a missing one; never fall back to shipping unsigned.
      - name: Check signing secrets
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          ARTIFACT_SIGNING_ENDPOINT: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          ARTIFACT_SIGNING_ACCOUNT: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          ARTIFACT_SIGNING_PROFILE: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
        run: |
          missing=""
          for v in AZURE_TENANT_ID AZURE_CLIENT_ID AZURE_CLIENT_SECRET ARTIFACT_SIGNING_ENDPOINT ARTIFACT_SIGNING_ACCOUNT ARTIFACT_SIGNING_PROFILE; do
            [ -z "${!v}" ] && missing="$missing $v"
          done
          [ -z "$missing" ] || { echo "::error::empty or unset:$missing — refusing to ship unsigned"; exit 1; }

      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p local-mates -p local-mates-app
      - run: .github/scripts/bundle-windows.sh

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet tool install -g vpk --version "$VPK_VERSION"

      # Previous release lets vpk build a small delta update; absent on the first release.
      - run: vpk download github --repoUrl "https://github.com/$GITHUB_REPOSITORY" --token "${{ secrets.GITHUB_TOKEN }}"
        continue-on-error: true

      # vpk signs every exe/dll it ships (skipping already-signed wintun.dll), plus Update.exe and
      # Setup.exe, through Azure Artifact Signing with an RFC 3161 timestamp.
      - name: Pack and sign
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          printf '{"Endpoint":"%s","CodeSigningAccountName":"%s","CertificateProfileName":"%s"}' \
            "${{ vars.ARTIFACT_SIGNING_ENDPOINT }}" "${{ vars.ARTIFACT_SIGNING_ACCOUNT }}" "${{ vars.ARTIFACT_SIGNING_PROFILE }}" \
            > "$RUNNER_TEMP/signing.json"
          vpk pack --packId LocalMates --packTitle "Local Mates" --packVersion "$VERSION" --packDir dist --mainExe local-mates-app.exe --icon app/ui/icon.ico \
            --azureTrustedSignFile "$RUNNER_TEMP/signing.json"
      - run: .github/scripts/verify-signatures.ps1
        shell: pwsh

      - if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: Releases/*Setup.exe
      - if: github.ref_type == 'tag'
        run: vpk upload github --repoUrl "https://github.com/$GITHUB_REPOSITORY" --token "${{ secrets.GITHUB_TOKEN }}" --publish --releaseName "Local Mates $VERSION" --tag "$GITHUB_REF_NAME"

  server:
    needs: version
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      REGISTRY: ghcr.io/${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@v4

      - name: Relay version from Cargo.lock
        run: echo "IROH_RELAY_VERSION=$(grep -A1 '^name = "iroh-relay"$' Cargo.lock | sed -n 's/^version = "\(.*\)"/\1/p')" >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: relay
          push: true
          build-args: IROH_RELAY_VERSION=${{ env.IROH_RELAY_VERSION }}
          tags: |
            ${{ env.REGISTRY }}/local-mates-relay:${{ env.VERSION }}
            ${{ env.REGISTRY }}/local-mates-relay:latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/local-mates-rooms:${{ env.VERSION }}
            ${{ env.REGISTRY }}/local-mates-rooms:latest

      # Chart version == app version, so ArgoCD tracking a semver range picks up each release.
      - uses: azure/setup-helm@v4
      - run: |
          helm package deploy/local-mates --version "$VERSION" --app-version "$VERSION"
          helm push "local-mates-$VERSION.tgz" "oci://$REGISTRY/charts"
