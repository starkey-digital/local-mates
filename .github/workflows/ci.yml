name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --release

      - name: Bundle with wintun.dll
        if: runner.os == 'Windows'
        shell: bash
        run: .github/scripts/bundle-windows.sh

      - name: Bundle binary
        if: runner.os != 'Windows'
        run: mkdir dist && cp target/release/local-mates dist/

      - uses: actions/upload-artifact@v4
        with:
          name: local-mates-${{ runner.os }}
          path: dist/
