name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  WINTUN_SHA256: 07c256185d6ee3652e09fa55c0b673e2624b565e02c4b9091c79ca7d2f24ef51

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo build --release

      - name: Bundle with wintun.dll
        if: runner.os == 'Windows'
        shell: bash
        run: |
          curl -sSfLo wintun.zip https://www.wintun.net/builds/wintun-0.14.1.zip
          echo "$WINTUN_SHA256  wintun.zip" | sha256sum -c -
          unzip -q wintun.zip
          mkdir dist
          cp target/release/local-mates.exe wintun/bin/amd64/wintun.dll dist/

      - name: Bundle binary
        if: runner.os != 'Windows'
        run: mkdir dist && cp target/release/local-mates dist/

      - uses: actions/upload-artifact@v4
        with:
          name: local-mates-${{ runner.os }}
          path: dist/
