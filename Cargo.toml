[package]
name = "local-mates"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive"] }
interprocess = { version = "2.4.4", features = ["tokio"] }
iroh = "1.3.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["full"] }
tokio-util = "0.7"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tun-rs = { version = "2.8.11", features = ["async"] }
velopack = "1.2.161"

[target."cfg(windows)".dependencies]
widestring = "1"
windows-service = "0.8.1"
