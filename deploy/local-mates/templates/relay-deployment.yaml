{{- if .Values.relay.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "relay.name" . }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "relay.name" . }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "relay.name" . }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/relay-configmap.yaml") . | sha256sum }}
    spec:
      securityContext:
        {{- include "podSecurity" . | nindent 8 }}
      containers:
        - name: relay
          image: {{ include "image" (dict "image" .Values.relay.image "appVersion" .Chart.AppVersion) }}
          ports:
            - { name: http, containerPort: 8080, protocol: TCP }
            - { name: https, containerPort: 8443, protocol: TCP }
            - { name: quic, containerPort: 7842, protocol: UDP }
          readinessProbe:
            tcpSocket:
              port: https
          securityContext:
            {{- include "containerSecurity" . | nindent 12 }}
          resources:
            {{- toYaml .Values.relay.resources | nindent 12 }}
          volumeMounts:
            - { name: config, mountPath: /etc/iroh-relay/config.toml, subPath: config.toml }
            - { name: tls, mountPath: /etc/iroh-relay/tls, readOnly: true }
      volumes:
        - name: config
          configMap:
            name: {{ include "relay.name" . }}
        - name: tls
          secret:
            secretName: {{ include "relay.tlsSecret" . }}
{{- end }}
