{{- if .Values.rooms.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rooms.name" . }}
spec:
  # State is in memory and rebuilt by hosts' renewals, so one replica.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "rooms.name" . }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "rooms.name" . }}
    spec:
      securityContext:
        {{- include "podSecurity" . | nindent 8 }}
      containers:
        - name: rooms
          image: {{ include "image" (dict "image" .Values.rooms.image "appVersion" .Chart.AppVersion) }}
          {{- with .Values.rooms.clientIpHeader }}
          env:
            - { name: CLIENT_IP_HEADER, value: {{ . | quote }} }
          {{- end }}
          ports:
            - { name: http, containerPort: 8080, protocol: TCP }
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          securityContext:
            {{- include "containerSecurity" . | nindent 12 }}
          resources:
            {{- toYaml .Values.rooms.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "rooms.name" . }}
spec:
  selector:
    app.kubernetes.io/name: {{ include "rooms.name" . }}
  ports:
    - { name: http, port: 80, targetPort: http, protocol: TCP }
{{- with .Values.rooms.ingress }}
{{- if .enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "rooms.name" $ }}
  {{- with .annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .tlsSecretName }}
  tls:
    - hosts: [{{ .host | quote }}]
      secretName: {{ .tlsSecretName }}
  {{- end }}
  rules:
    - host: {{ required "rooms.ingress.host is required" .host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "rooms.name" $ }}
                port:
                  name: http
{{- end }}
{{- end }}
{{- end }}
