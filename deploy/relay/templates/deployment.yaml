apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Release.Name }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: relay
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          ports:
            - { name: http, containerPort: 8080, protocol: TCP }
            - { name: https, containerPort: 8443, protocol: TCP }
            - { name: quic, containerPort: 7842, protocol: UDP }
          readinessProbe:
            tcpSocket:
              port: https
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - { name: config, mountPath: /etc/iroh-relay/config.toml, subPath: config.toml }
            - { name: tls, mountPath: /etc/iroh-relay/tls, readOnly: true }
      volumes:
        - name: config
          configMap:
            name: {{ .Release.Name }}
        - name: tls
          secret:
            secretName: {{ include "relay.tlsSecret" . }}
